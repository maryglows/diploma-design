<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="207mm" viewBox="0 0 190 207"><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="5" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">1. Выбрать набор</text><rect x="9" y="10" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="7,9 7,20" fill="none" stroke="#606D6D" stroke-width="1"/><text x="11" y="14.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><text x="53" y="18" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="2" y="29.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Пользователь освобождает подход и определяет, нужны ли</text><text x="2" y="32.701344444444445" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">панель, одна гантель или пара. Сиденье сохраняет рабочее</text><text x="2" y="36.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">состояние.</text><rect x="97" y="0" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="5" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">2. Извлечь веса</text><rect x="106" y="10" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="104,9 104,20" fill="none" stroke="#606D6D" stroke-width="1"/><text x="108" y="14.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><rect x="110" y="18" width="11" height="6" rx="0" fill="#E7D5BD" stroke="#B5B3AC" stroke-width="0.25"/><circle cx="161" cy="17" r="2" fill="#7D8E92"/><text x="167" y="18" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">человек</text><polyline points="131,15 156,17" fill="none" stroke="#A86A3D" stroke-width="0.55"/><polyline points="154.13546829531634,17.723547871415203 156,17 154.27421398812874,15.989226711260402" fill="none" stroke="#A86A3D" stroke-width="0.55"/><text x="99" y="29.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Открывает нужный отсек и берёт предмет из гнезда.</text><text x="99" y="32.701344444444445" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Проверяется наклон к низкому хранению; выдвинутый ящик</text><text x="99" y="36.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">не считается опорой.</text><rect x="0" y="69" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="74" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">3. Закрыть и отойти</text><rect x="9" y="79" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="7,78 7,89" fill="none" stroke="#606D6D" stroke-width="1"/><text x="11" y="83.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><circle cx="64" cy="86" r="2" fill="#7D8E92"/><text x="70" y="87" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">человек</text><polyline points="34,84 59,86" fill="none" stroke="#A86A3D" stroke-width="0.55"/><polyline points="57.13546829531635,86.7235478714152 59,86 57.27421398812873,84.9892267112604" fill="none" stroke="#A86A3D" stroke-width="0.55"/><text x="2" y="98.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Закрывает отсек и занимает свободную позицию перед</text><text x="2" y="101.70134444444444" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">корпусом. Для стоячих действий мягкая панель под стопами</text><text x="2" y="105.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">не назначается автоматически.</text><rect x="97" y="69" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="74" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">4. Рассмотреть силовые действия</text><rect x="106" y="79" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="104,78 104,89" fill="none" stroke="#606D6D" stroke-width="1"/><text x="108" y="83.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><circle cx="161" cy="86" r="2" fill="#7D8E92"/><text x="167" y="87" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">человек</text><polyline points="131,84 156,86" fill="none" stroke="#A86A3D" stroke-width="0.55"/><polyline points="154.13546829531634,86.7235478714152 156,86 154.27421398812874,84.9892267112604" fill="none" stroke="#A86A3D" stroke-width="0.55"/><text x="99" y="98.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Присед и наклон с гантелями происходят на свободном полу.</text><text x="99" y="101.70134444444444" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Корпус, хват и кромки не входят в траекторию головы или</text><text x="99" y="105.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">грузов.</text><rect x="0" y="138" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="143" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">5. Перейти на панель</text><rect x="9" y="148" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="7,147 7,158" fill="none" stroke="#606D6D" stroke-width="1"/><text x="11" y="152.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><rect x="52" y="148" width="33" height="13" rx="1" fill="#DEE6DE" stroke="#B5B3AC" stroke-width="0.25"/><text x="57" y="156" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">панель</text><circle cx="69" cy="153" r="1.3" fill="#7D8E92"/><text x="2" y="167.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">После возврата весов панель используется для отжимания с</text><text x="2" y="170.70134444444443" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">коленей. Переход выполняется без открытого ящика в зоне</text><text x="2" y="174.4026888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">головы.</text><rect x="97" y="138" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="143" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">6. Вернуть комплект</text><rect x="106" y="148" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="104,147 104,158" fill="none" stroke="#606D6D" stroke-width="1"/><text x="108" y="152.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><text x="150" y="156" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="99" y="167.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Гантели в своих гнёздах, панель в слоте, проход свободен.</text><text x="99" y="170.70134444444443" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Тяжёлый отсек возвращён в состояние ограничения доступа.</text></svg>