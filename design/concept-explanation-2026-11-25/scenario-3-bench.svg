<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="207mm" viewBox="0 0 190 207"><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="5" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">1. Подготовить место</text><rect x="9" y="10" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="7,9 7,20" fill="none" stroke="#606D6D" stroke-width="1"/><text x="11" y="14.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><text x="53" y="18" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="2" y="29.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Пользователь или помощник освобождает переднюю зону.</text><text x="2" y="32.701344444444445" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Панель и веса для этих трёх основных примеров не</text><text x="2" y="36.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">раскладываются.</text><rect x="97" y="0" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="5" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">2. Проверить готовую посадку</text><rect x="106" y="10" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="104,9 104,20" fill="none" stroke="#606D6D" stroke-width="1"/><text x="108" y="14.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><circle cx="118" cy="24" r="1.8" fill="#7D8E92"/><text x="150" y="18" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">положение</text><text x="99" y="29.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Сиденье уже горизонтально. На проверенной компоновке</text><text x="99" y="32.701344444444445" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">уточняются стопы, глубина, упругость и доступ; одно число</text><text x="99" y="36.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">высоты не подходит всем.</text><rect x="0" y="69" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="74" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">3. Сесть и встать</text><rect x="9" y="79" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="7,78 7,89" fill="none" stroke="#606D6D" stroke-width="1"/><text x="11" y="83.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><circle cx="21" cy="93" r="1.8" fill="#7D8E92"/><text x="53" y="87" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">положение</text><text x="2" y="98.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Сценарий исследует переход с сиденья на стопы. Потребность</text><text x="2" y="101.70134444444444" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">в помощи руками уточняется; высокий хват у торца не</text><text x="2" y="105.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">объявлен парой подлокотников.</text><rect x="97" y="69" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="74" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">4. Освободить локти</text><rect x="106" y="79" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="104,78 104,89" fill="none" stroke="#606D6D" stroke-width="1"/><text x="108" y="83.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><circle cx="118" cy="93" r="1.8" fill="#7D8E92"/><text x="150" y="87" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">положение</text><text x="99" y="98.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Для поворота сидя выбирается зона вдали от стойки хвата.</text><text x="99" y="101.70134444444444" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Проверяется, не пересекает ли каркас локоть и путь посадки.</text><rect x="0" y="138" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="143" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">5. Перейти к хвату</text><rect x="9" y="148" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="7,147 7,158" fill="none" stroke="#606D6D" stroke-width="1"/><text x="11" y="152.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><circle cx="2" cy="159" r="1.8" fill="#7D8E92"/><text x="53" y="156" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">положение</text><text x="2" y="167.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Для подъёма пяток рассматривается отдельная позиция стоя у</text><text x="2" y="170.70134444444443" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">торца. Это допустимо только после подбора хвата и проверки</text><text x="2" y="174.4026888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">рамы, не по рисунку.</text><rect x="97" y="138" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="143" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">6. Завершить использование</text><rect x="106" y="148" width="25" height="8" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="104,147 104,158" fill="none" stroke="#606D6D" stroke-width="1"/><text x="108" y="152.8" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><text x="150" y="156" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="99" y="167.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Человек выходит по свободному подходу. Трансформация и</text><text x="99" y="170.70134444444443" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">перенос весов не требуются; изделие остаётся в исходном</text><text x="99" y="174.4026888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">состоянии.</text></svg>