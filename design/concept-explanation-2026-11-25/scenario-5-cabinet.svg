<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="207mm" viewBox="0 0 190 207"><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="5" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">1. Выбрать доступ</text><rect x="13" y="10" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="11,9 11,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="31,9 31,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="15" y="14" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><text x="53" y="18" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="2" y="29.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Пользователь освобождает место для рук и пола. Сиденье</text><text x="2" y="32.701344444444445" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">остаётся убранным: для исходного приседа, наклона и</text><text x="2" y="36.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">отжимания оно не нужно.</text><rect x="97" y="0" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="5" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">2. Получить веса</text><rect x="110" y="10" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="108,9 108,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="128,9 128,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="112" y="14" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><circle cx="161" cy="17" r="2" fill="#7D8E92"/><text x="167" y="18" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">человек</text><polyline points="131,15 156,17" fill="none" stroke="#A86A3D" stroke-width="0.55"/><polyline points="154.13546829531634,17.723547871415203 156,17 154.27421398812874,15.989226711260402" fill="none" stroke="#A86A3D" stroke-width="0.55"/><text x="99" y="29.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Берёт гантель или пару из отдельных мест. Высоту тяжёлой</text><text x="99" y="32.701344444444445" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">полки и способ извлечения нужно переработать по обмерам,</text><text x="99" y="36.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">не принимать с картинки.</text><rect x="0" y="69" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="74" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">3. Освободить подход</text><rect x="13" y="79" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="11,78 11,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="31,78 31,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="15" y="83" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><circle cx="64" cy="86" r="2" fill="#7D8E92"/><text x="70" y="87" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">человек</text><polyline points="34,84 59,86" fill="none" stroke="#A86A3D" stroke-width="0.55"/><polyline points="57.13546829531635,86.7235478714152 59,86 57.27421398812873,84.9892267112604" fill="none" stroke="#A86A3D" stroke-width="0.55"/><text x="2" y="98.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Закрывает/освобождает хранение и занимает рабочую</text><text x="2" y="101.70134444444444" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">позицию вне полозьев. Нельзя ставить стопу на основание как</text><text x="2" y="105.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">на выбранную платформу.</text><rect x="97" y="69" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="74" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">4. Рассмотреть присед и наклон</text><rect x="110" y="79" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="108,78 108,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="128,78 128,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="112" y="83" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><circle cx="161" cy="86" r="2" fill="#7D8E92"/><text x="167" y="87" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">человек</text><polyline points="131,84 156,86" fill="none" stroke="#A86A3D" stroke-width="0.55"/><polyline points="154.13546829531634,86.7235478714152 156,86 154.27421398812874,84.9892267112604" fill="none" stroke="#A86A3D" stroke-width="0.55"/><text x="99" y="98.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Свободные веса работают в руках, тело - на свободном полу.</text><text x="99" y="101.70134444444444" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Ножки и откидная панель не добавляют пользы этим</text><text x="99" y="105.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">движениям.</text><rect x="0" y="138" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="143" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">5. Перейти к панели</text><rect x="13" y="148" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="11,147 11,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="31,147 31,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="15" y="152" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><rect x="52" y="148" width="33" height="13" rx="1" fill="#DEE6DE" stroke="#B5B3AC" stroke-width="0.25"/><text x="57" y="156" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">панель</text><circle cx="69" cy="153" r="1.3" fill="#7D8E92"/><text x="2" y="167.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">После возврата весов отдельная панель используется для</text><text x="2" y="170.70134444444443" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">отжимания с коленей. Сиденье всё ещё не требуется</text><text x="2" y="174.4026888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">раскрывать.</text><rect x="97" y="138" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="143" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">6. Вернуть предметы</text><rect x="110" y="148" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="108,147 108,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="128,147 128,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="112" y="152" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><text x="150" y="156" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="99" y="167.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Панель сложена в отдельном месте; веса в гнёздах и с</text><text x="99" y="170.70134444444443" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">выбранным ограничением доступа. Пол перед изделием</text><text x="99" y="174.4026888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">освобождён.</text></svg>