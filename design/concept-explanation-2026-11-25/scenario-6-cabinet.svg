<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="207mm" viewBox="0 0 190 207"><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="5" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">1. Освободить трансформацию</text><rect x="13" y="10" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="11,9 11,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="31,9 31,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="15" y="14" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><text x="53" y="18" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="2" y="29.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Пользователь либо помощник убирает предметы из зоны</text><text x="2" y="32.701344444444445" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">сиденья и полозьев. Самостоятельность подготовки</text><text x="2" y="36.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">проверяется отдельно.</text><rect x="97" y="0" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="5" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">2. Развернуть сиденье</text><rect x="110" y="10" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="108,9 108,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="128,9 128,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="112" y="14" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><rect x="111" y="16" width="14" height="7" rx="0" fill="#D8CFBD" stroke="#B5B3AC" stroke-width="0.25"/><circle cx="112" cy="22" r="0.8" fill="#606D6D"/><circle cx="124" cy="22" r="0.8" fill="#606D6D"/><text x="150" y="18" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="99" y="29.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">В будущем проверенном механизме переводит сиденье,</text><text x="99" y="32.701344444444445" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">выводит обе ножки и подтверждает рабочую фиксацию.</text><text x="99" y="36.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Шарнир ещё не специфицирован.</text><rect x="0" y="69" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="74" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">3. Рассмотреть посадку</text><rect x="13" y="79" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="11,78 11,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="31,78 31,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="15" y="83" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><rect x="14" y="85" width="14" height="7" rx="0" fill="#D8CFBD" stroke="#B5B3AC" stroke-width="0.25"/><circle cx="15" cy="91" r="0.8" fill="#606D6D"/><circle cx="27" cy="91" r="0.8" fill="#606D6D"/><circle cx="21" cy="93" r="1.8" fill="#7D8E92"/><text x="53" y="87" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">положение</text><text x="2" y="98.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">После готовности узлов проверяются подход, стопы и две</text><text x="2" y="101.70134444444444" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">боковые опоры. Перед коленями нет поперечной</text><text x="2" y="105.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">перекладины.</text><rect x="97" y="69" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="74" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">4. Проверить вставание</text><rect x="110" y="79" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="108,78 108,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="128,78 128,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="112" y="83" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><rect x="111" y="85" width="14" height="7" rx="0" fill="#D8CFBD" stroke="#B5B3AC" stroke-width="0.25"/><circle cx="112" cy="91" r="0.8" fill="#606D6D"/><circle cx="124" cy="91" r="0.8" fill="#606D6D"/><circle cx="118" cy="93" r="1.8" fill="#7D8E92"/><text x="150" y="87" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">положение</text><text x="99" y="98.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Изучается выход вперёд между опорами. Их положение</text><text x="99" y="101.70134444444444" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">может помогать одному пользователю и мешать другому; это</text><text x="99" y="105.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">требует наблюдения.</text><rect x="0" y="138" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="143" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">5. Выявить ограничение</text><rect x="13" y="148" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="11,147 11,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="31,147 31,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="15" y="152" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><rect x="14" y="154" width="14" height="7" rx="0" fill="#D8CFBD" stroke="#B5B3AC" stroke-width="0.25"/><circle cx="15" cy="160" r="0.8" fill="#606D6D"/><circle cx="27" cy="160" r="0.8" fill="#606D6D"/><text x="48" y="156" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="700" fill="#9D593A">доработать опоры</text><text x="2" y="167.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Поворот сидя может конфликтовать с подлокотниками;</text><text x="2" y="170.70134444444443" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">высокий хват стоя не определён. Эти два действия не</text><text x="2" y="174.4026888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">показаны как уже решённые.</text><rect x="97" y="138" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="143" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">6. Вернуть хранение</text><rect x="110" y="148" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="108,147 108,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="128,147 128,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="112" y="152" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><text x="150" y="156" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="99" y="167.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">После полного выхода человека сиденье и ножки переводятся</text><text x="99" y="170.70134444444443" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">в убранное состояние и удерживаются. Основание не</text><text x="99" y="174.4026888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">исчезает.</text></svg>