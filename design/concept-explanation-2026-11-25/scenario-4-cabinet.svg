<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="207mm" viewBox="0 0 190 207"><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="5" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">1. Оставить сиденье убранным</text><rect x="13" y="10" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="11,9 11,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="31,9 31,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="15" y="14" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><text x="53" y="18" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="2" y="29.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Взрослый освобождает пол. Нет необходимости раскрывать</text><text x="2" y="32.701344444444445" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">сиденье ради действия ребёнка на полу; выступающее</text><text x="2" y="36.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">основание остаётся.</text><rect x="97" y="0" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="5" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">2. Достать панель и лёгкое</text><rect x="110" y="10" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="108,9 108,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="128,9 128,25" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="112" y="14" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><circle cx="161" cy="17" r="2" fill="#7D8E92"/><text x="167" y="18" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">человек</text><polyline points="131,15 156,17" fill="none" stroke="#A86A3D" stroke-width="0.55"/><polyline points="154.13546829531634,17.723547871415203 156,17 154.27421398812874,15.989226711260402" fill="none" stroke="#A86A3D" stroke-width="0.55"/><text x="99" y="29.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Взрослый готовит мягкий предмет и цель. Доступ не должен</text><text x="99" y="32.701344444444445" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">требовать перестановки тяжёлых вещей или включения</text><text x="99" y="36.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">шарниров.</text><rect x="0" y="69" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="74" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">3. Отделить рабочую зону</text><rect x="13" y="79" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="11,78 11,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="31,78 31,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="15" y="83" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><rect x="52" y="79" width="33" height="13" rx="1" fill="#DEE6DE" stroke="#B5B3AC" stroke-width="0.25"/><text x="57" y="87" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">панель</text><circle cx="69" cy="84" r="1.3" fill="#7D8E92"/><circle cx="47" cy="87" r="1.3" fill="#AA7C52"/><text x="2" y="98.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Панель располагают вне полозьев и зоны возможной</text><text x="2" y="101.70134444444444" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">трансформации. Ребёнок и взрослый имеют свои места, не</text><text x="2" y="105.40268888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">залезая на шкаф.</text><rect x="97" y="69" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="74" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">4. Использовать панель</text><rect x="110" y="79" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="108,78 108,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="128,78 128,94" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="112" y="83" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><rect x="149" y="79" width="33" height="13" rx="1" fill="#DEE6DE" stroke="#B5B3AC" stroke-width="0.25"/><text x="154" y="87" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">панель</text><circle cx="166" cy="84" r="1.3" fill="#7D8E92"/><circle cx="144" cy="87" r="1.3" fill="#AA7C52"/><text x="99" y="98.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Вытягивание и дотягивание происходят на полу. Высокое</text><text x="99" y="101.70134444444444" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">хранение не используется как цель по умолчанию.</text><rect x="0" y="138" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="2" y="143" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">5. Сменить положение</text><rect x="13" y="148" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="11,147 11,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="31,147 31,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="15" y="152" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><rect x="52" y="148" width="33" height="13" rx="1" fill="#DEE6DE" stroke="#B5B3AC" stroke-width="0.25"/><text x="57" y="156" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">панель</text><circle cx="69" cy="153" r="1.3" fill="#7D8E92"/><circle cx="47" cy="156" r="1.3" fill="#AA7C52"/><text x="2" y="167.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Для примера лёжа остаётся та же панель. Шкаф сохраняется</text><text x="2" y="170.70134444444443" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">закрытым; петли и опоры не являются игровым инвентарём.</text><rect x="97" y="138" width="93" height="66" rx="1" fill="#FEFDFC" stroke="#B5B3AC" stroke-width="0.25"/><text x="99" y="143" font-family="Segoe UI,sans-serif" font-size="3.069166666666666" font-weight="700" fill="#42382F">6. Вернуть лёгкий набор</text><rect x="110" y="148" width="16" height="6" rx="1" fill="#CDB99C" stroke="#B5B3AC" stroke-width="0.25"/><polyline points="108,147 108,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><polyline points="128,147 128,163" fill="none" stroke="#606D6D" stroke-width="0.8"/><text x="112" y="152" font-family="Segoe UI,sans-serif" font-size="2.5399999999999996" font-weight="400" fill="#42382F">корпус</text><text x="150" y="156" font-family="Segoe UI,sans-serif" font-size="2.469444444444444" font-weight="400" fill="#42382F">хранение</text><text x="99" y="167.0" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Взрослый убирает предметы и проверяет удержание сиденья.</text><text x="99" y="170.70134444444443" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">Будущий способ защиты весов должен работать независимо</text><text x="99" y="174.4026888888889" font-family="Segoe UI,sans-serif" font-size="3.0338888888888884" font-weight="400" fill="#42382F">от высоты полки.</text></svg>