<text x="12" y="30" font-family="Arial" font-size="4.2333333333333325" font-weight="400" fill="#203540" text-anchor="start">Человечки показывают движение. Стрелки помогают проследить, что меняется.</text>
<text x="12" y="39.0" font-family="Arial" font-size="3.7041666666666666" font-weight="400" fill="#203540" text-anchor="start">Размеры - прежние пробные предположения для примерки в комнате. Их ещё нужно проверить обмером. Рисунки без масштаба.</text>
