<text x="196" y="70" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Что делает человек</text>
<text x="196" y="76.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Человек держит гантель перед грудью, сгибает ноги и возвращается стоя.</text>
<text x="196" y="93" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Какое место оставить</text>
<text x="196" y="99.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Сзади нужно место для таза, спереди - для коленей и гантели.</text>
<text x="196" y="119" font-family="Arial" font-size="3.951111111111111" font-weight="700" fill="#087F80" text-anchor="start">Для примерки: 150 × 150 см</text>
