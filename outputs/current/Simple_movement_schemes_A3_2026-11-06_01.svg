<text x="196" y="154.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Таз уходит назад, корпус наклоняется вперёд. Гантели опускаются рядом с ногами.</text>
<text x="196" y="171" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Какое место оставить</text>
<text x="196" y="177.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Оставить место перед головой и за тазом. Рядом не должно быть открытого ящика.</text>
