<text x="196" y="148" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Что делает человек</text>
<text x="196" y="154.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Стопы остаются на полу, ладони - на стене. Тело приближается к стене и отдаляется.</text>
<text x="196" y="171" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Какое место оставить</text>
<text x="196" y="177.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Нужно место между стопами и стеной, а также для шага назад. Шкаф не заменяет стену.</text>
<text x="196" y="197" font-family="Arial" font-size="3.951111111111111" font-weight="700" fill="#087F80" text-anchor="start">Для примерки у стены: 140 × 140 см</text>
