<text x="196" y="226" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Что делает человек</text>
<text x="196" y="232.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Человек слегка наклоняет корпус вперёд, встаёт и затем возвращается на сиденье.</text>
<text x="196" y="249" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Какое место оставить</text>
<text x="196" y="255.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Перед стулом оставить место для стоп и наклона. Стул и проход к нему тоже занимают место.</text>
<text x="196" y="275" font-family="Arial" font-size="3.951111111111111" font-weight="700" fill="#087F80" text-anchor="start">Для примерки со стулом: 170 × 150 см</text>
