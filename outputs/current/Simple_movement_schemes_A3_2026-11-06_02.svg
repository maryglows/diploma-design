<text x="196" y="70" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Что делает человек</text>
<text x="196" y="76.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Ребёнок опирается на ладонь и противоположное колено. Другие руку и ногу вытягивает.</text>
<text x="196" y="93" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Какое место оставить</text>
<text x="196" y="99.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Кисть выходит вперёд, стопа - назад. Короткой площадки только под коленями мало.</text>
<text x="196" y="119" font-family="Arial" font-size="3.951111111111111" font-weight="700" fill="#087F80" text-anchor="start">Для примерки: 220 × 150 см</text>
