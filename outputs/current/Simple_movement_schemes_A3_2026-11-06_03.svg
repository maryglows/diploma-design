<text x="196" y="70" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Что делает человек</text>
<text x="196" y="76.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Человек сидит на стуле и поворачивает верх тела в сторону. Стопы остаются на полу.</text>
<text x="196" y="93" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Какое место оставить</text>
<text x="196" y="99.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">По бокам нужно место для рук и локтей. Соседний шкаф не должен мешать повороту.</text>
<text x="196" y="119" font-family="Arial" font-size="3.951111111111111" font-weight="700" fill="#087F80" text-anchor="start">Для примерки со стулом: 200 × 160 см</text>
