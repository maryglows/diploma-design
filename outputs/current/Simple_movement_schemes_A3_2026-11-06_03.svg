<text x="103" y="277" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#667780" text-anchor="middle">Два человека напротив друг друга</text>
<text x="196" y="226" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Что делает человек</text>
<text x="196" y="232.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Ребёнок и взрослый стоят на коленях и передают лёгкий мяч между собой.</text>
<text x="196" y="249" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Какое место оставить</text>
<text x="196" y="255.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Нужно место для обоих людей и мяча между ними. Отдельно проверить, как подобрать укатившийся мяч.</text>
<text x="196" y="275" font-family="Arial" font-size="3.951111111111111" font-weight="700" fill="#087F80" text-anchor="start">Для примерки на двоих: 260 × 180 см</text>
