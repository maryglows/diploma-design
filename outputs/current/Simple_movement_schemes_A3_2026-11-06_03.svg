<text x="161" y="199" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#667780" text-anchor="middle">Приставляет ногу</text>
<text x="196" y="148" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Что делает человек</text>
<text x="196" y="154.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Одна нога шагает в сторону, затем другая приближается к ней. Человек перемещается по полу.</text>
<text x="196" y="171" font-family="Arial" font-size="4.056944444444444" font-weight="700" fill="#203540" text-anchor="start">Какое место оставить</text>
<text x="196" y="177.0" font-family="Arial" font-size="3.951111111111111" font-weight="400" fill="#203540" text-anchor="start">Нужна свободная дорожка. Её длина зависит от числа шагов; при необходимости рядом - устойчивая опора.</text>
<text x="196" y="197" font-family="Arial" font-size="3.951111111111111" font-weight="700" fill="#087F80" text-anchor="start">Короткий участок для примерки: 260 × 140 см</text>
