<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<rect width="420" height="297" fill="white"/>
<text x="12" y="19" font-family="Arial" font-size="8.113888888888887" font-weight="700" fill="#203540" text-anchor="start">Конструкция: опоры, хранение и ограничения</text>
<text x="12" y="29.0" font-family="Arial" font-size="3.8805555555555555" font-weight="400" fill="#203540" text-anchor="start">Схемы показывают предполагаемый путь нагрузки. Стрелки качественные; толщина деталей, крепёж, допустимые массы и прочность ещё не рассчитаны.</text>
<text x="12" y="53" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">А. Неподвижный несущий верх</text>
<text x="146" y="53" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Б. Два самостоятельных каркаса</text>
<text x="280" y="53" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">В. Корпус отдельно от пола</text>
