<rect x="214" y="119" width="40" height="3" fill="#667780" stroke="none" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
<text x="158" y="133" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Каждый 500 × 450 × 450 У</text>
<text x="158" y="141" font-family="Arial" font-size="3.3161111111111112" font-weight="400" fill="#667780" text-anchor="start">Перемычки под телом нет</text>
<rect x="304" y="62" width="40" height="78" fill="none" stroke="#203540" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="301" y="140" width="46" height="4" fill="#667780" stroke="none" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="304" y1="88" x2="344" y2="88" fill="none" stroke="#667780" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="304" y1="112" x2="344" y2="112" fill="none" stroke="#667780" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="307" y="123" width="22" height="13" fill="#E9EDEF" stroke="#667780" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="309" y="132" font-family="Arial" font-size="2.998611111111111" font-weight="400" fill="#667780" text-anchor="start">груз</text>
<rect x="355" y="141" width="48" height="3" fill="#E4F3F0" stroke="#087F80" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="379" y1="141" x2="379" y2="144" fill="none" stroke="#087F80" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
