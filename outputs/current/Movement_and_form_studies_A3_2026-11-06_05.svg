<polygon points="362,92 361.05,91.58 361.05,92.42" fill="#AE4775" stroke="#AE4775" stroke-width="0.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="87" font-family="Arial" font-size="3.8805555555555555" font-weight="700" fill="#AE4775" text-anchor="start">F</text>
<text x="350" y="132" font-family="Arial" font-size="3.175" font-weight="400" fill="#087F80" text-anchor="start">панель</text>
<text x="285" y="154" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Корпус 700 × 400 × 1100 У</text>
<text x="12" y="171" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Размеры и связь с движением</text>
<text x="12" y="179.0" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">1200 × 450 × 450 мм У; пятно 0,54 м² Р. Коврик на полу - для опоры</text>
<text x="12" y="183.4" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">ладоней/коленей. Посадка/вставание возможны как функция для</text>
<text x="12" y="187.8" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">проверки, не готовый допуск.</text>
<text x="146" y="171" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Размеры и связь с движением</text>
<text x="146" y="179.0" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Два модуля по 500 × 450 × 450 мм У; суммарное пятно 0,45 м² Р. У</text>
<text x="146" y="183.4" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">каждого своё основание. Можно менять расстановку, но рабочие зоны</text>
<text x="146" y="187.8" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">людей проверить отдельно.</text>
<text x="280" y="171" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Размеры и связь с движением</text>
<text x="280" y="179.0" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">700 × 400 × 1100 мм У; пятно 0,28 м² Р. Панель раскрывается на полу.</text>
<text x="280" y="183.4" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Шкаф хранит предметы, не заменяет стену, сиденье и поддержку рукой.</text>
<text x="12" y="220.0" font-family="Arial" font-size="3.4219444444444442" font-weight="400" fill="#203540" text-anchor="start">Проверить: прогиб верха; эксцентричную посадку; скольжение;</text>
<text x="12" y="224.2" font-family="Arial" font-size="3.4219444444444442" font-weight="400" fill="#203540" text-anchor="start">опрокидывание с выдвинутым лотком. Перед занятием лоток закрыть.</text>
<text x="146" y="220.0" font-family="Arial" font-size="3.4219444444444442" font-weight="400" fill="#203540" text-anchor="start">Проверить: устойчивость каждого модуля; перенос с грузом; контакт ручек и</text>
<text x="146" y="224.2" font-family="Arial" font-size="3.4219444444444442" font-weight="400" fill="#203540" text-anchor="start">кромок. Стык двух верхов не считать непрерывной опорой.</text>
<text x="280" y="220.0" font-family="Arial" font-size="3.4219444444444442" font-weight="400" fill="#203540" text-anchor="start">Проверить: доставание и открывание без опрокидывания; доступ детей;</text>
<text x="280" y="224.2" font-family="Arial" font-size="3.4219444444444442" font-weight="400" fill="#203540" text-anchor="start">стык напольной панели. Если без сверления неустойчив - пересмотреть</text>
<text x="280" y="228.4" font-family="Arial" font-size="3.4219444444444442" font-weight="400" fill="#203540" text-anchor="start">вариант.</text>
<rect x="12" y="250" width="396" height="34" fill="#E4F3F0" stroke="none" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16" y="258" font-family="Arial" font-size="3.7041666666666666" font-weight="700" fill="#087F80" text-anchor="start">Проверка устойчивости: Mопр = F × h; Mуд = G × b. Скольжение и прочность проверяются отдельно.</text>
<text x="16" y="266.0" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">F - горизонтальная сила; h - её высота; G - вес; b - плечо веса до края опоры. Пока нет значений сил и масс, нельзя назначить допустимую нагрузку. Начать предлагаю с компоновочного макета А; Б сравнить по расстановке, В - по</text>
<text x="16" y="270.2" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">доступу и устойчивости.</text>
<text x="12" y="292" font-family="Arial" font-size="3.175" font-weight="400" fill="#667780" text-anchor="start">Пробные размеры - предложения помощника. Степ, прыжки, подвешивание и анкер ленты в эти варианты не включены.</text>
</svg>