<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<rect width="420" height="297" fill="white"/>
<text x="12" y="19" font-family="Arial" font-size="8.113888888888887" font-weight="700" fill="#203540" text-anchor="start">Общие действия → функции изделия</text>
<text x="12" y="29.0" font-family="Arial" font-size="3.8805555555555555" font-weight="400" fill="#203540" text-anchor="start">Я сопоставила движения из возрастных листов. Общность движения помогает выделить функцию, но не задаёт одинаковые высоты, нагрузки и размеры.</text>
<text x="14" y="51" font-family="Arial" font-size="3.6336111111111116" font-weight="700" fill="#087F80" text-anchor="start">Функция</text>
<text x="57" y="51" font-family="Arial" font-size="3.6336111111111116" font-weight="700" fill="#087F80" text-anchor="start">Детские примеры</text>
<text x="141" y="51" font-family="Arial" font-size="3.6336111111111116" font-weight="700" fill="#087F80" text-anchor="start">Молодой взрослый</text>
<text x="225" y="51" font-family="Arial" font-size="3.6336111111111116" font-weight="700" fill="#087F80" text-anchor="start">Старший пользователь</text>
<text x="309" y="51" font-family="Arial" font-size="3.6336111111111116" font-weight="700" fill="#087F80" text-anchor="start">Следствие для формы</text>
<rect x="12" y="57" width="396" height="22" fill="#E4F3F0" stroke="none" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
<text x="14" y="62.0" font-family="Arial" font-size="3.3513888888888888" font-weight="700" fill="#203540" text-anchor="start">Контакт с полом</text>
<text x="57" y="62.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Четвереньки; мост; рука и нога [S7]</text>
<text x="141" y="62.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Колени/ладони; боковая опора [S3, S10]</text>
<text x="225" y="62.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Не основной сценарий: переход на пол проверить</text>
<text x="225" y="65.8" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">отдельно</text>
<text x="309" y="62.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Отдельный коврик/панель; кромки вне контакта</text>
<rect x="12" y="80" width="396" height="22" fill="#F7F9F9" stroke="none" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
<text x="14" y="85.0" font-family="Arial" font-size="3.3513888888888888" font-weight="700" fill="#203540" text-anchor="start">Сесть / встать</text>
<text x="57" y="85.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Низкая игровая поза не равна взрослому сиденью</text>
<text x="141" y="85.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Посадка для подготовки и смены инвентаря</text>
<text x="225" y="85.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Посадка, наклон вперёд, вставание [S4]</text>
<text x="309" y="85.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Высоту подбирать по ногам и позе, не по медиане роста</text>
<rect x="12" y="103" width="396" height="22" fill="#E4F3F0" stroke="none" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
<text x="14" y="108.0" font-family="Arial" font-size="3.3513888888888888" font-weight="700" fill="#203540" text-anchor="start">Оттолкнуться</text>
<text x="57" y="108.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Ладони на стене [S7]</text>
<text x="141" y="108.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Ладони и колени на полу [S3]</text>
<text x="225" y="108.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Ладони на стене [S4]</text>
<text x="309" y="108.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Вертикальная и напольная опоры различаются по силам</text>
<rect x="12" y="126" width="396" height="22" fill="#F7F9F9" stroke="none" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
<text x="14" y="131.0" font-family="Arial" font-size="3.3513888888888888" font-weight="700" fill="#203540" text-anchor="start">Потянуть</text>
<text x="57" y="131.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Дотянуться до предмета [S7]</text>
<text x="141" y="131.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Гантели к корпусу в наклоне [S3]</text>
<text x="225" y="131.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Лента в прежнем листе; поворот сидя [S5]</text>
<text x="309" y="131.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Захват и свободный ход локтя; анкер не задан</text>
<rect x="12" y="149" width="396" height="22" fill="#E4F3F0" stroke="none" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
<text x="14" y="154.0" font-family="Arial" font-size="3.3513888888888888" font-weight="700" fill="#203540" text-anchor="start">Шаг / перенос</text>
<text x="57" y="154.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Мяч, предмет, смена точки опоры</text>
<text x="141" y="154.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Подход к гантелям; наклон [S2]</text>
<text x="225" y="154.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Боковые шаги; поддержка рядом [S6]</text>
<text x="309" y="154.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Свободный пол; неподвижное хранение вне маршрута</text>
<rect x="12" y="172" width="396" height="22" fill="#F7F9F9" stroke="none" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
<text x="14" y="177.0" font-family="Arial" font-size="3.3513888888888888" font-weight="700" fill="#203540" text-anchor="start">Достать / убрать</text>
<text x="57" y="177.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Доступ к лёгкому предмету при участии взрослого</text>
<text x="141" y="177.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Раздельные места для гантелей, лент и коврика</text>
<text x="225" y="177.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Доступ без лишнего наклона и тянущегося захвата</text>
<text x="309" y="177.0" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">Лёгкое - доступно; тяжёлое - низко, доступ и устойчивость</text>
<text x="309" y="180.8" font-family="Arial" font-size="3.3513888888888888" font-weight="400" fill="#203540" text-anchor="start">проверить</text>
<text x="12" y="207" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">База для сравнения</text>
<text x="12" y="215.0" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Свободная зона пола, отдельная мягкая поверхность, понятные места</text>
<text x="12" y="219.4" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">хранения. Сначала проверяю подготовку и уборку, затем добавляю</text>
<text x="12" y="223.8" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">силовую функцию.</text>
<text x="148" y="207" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Инвентарь по задаче</text>
<text x="148" y="215.0" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Гантели: наклон/тяга/присед. Лента: отдельный сценарий сопротивления.</text>
<text x="148" y="219.4" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Мяч: взаимодействие. Стул или поддержка: отдельная опорная функция,</text>
<text x="148" y="223.8" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">не аксессуар хранилища.</text>
<text x="284" y="207" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Что не объединяю автоматически</text>
<text x="284" y="215.0" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Сиденье ≠ опора для отжимания ≠ анкер ленты. Одинаковая форма</text>
<text x="284" y="219.4" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">движения не доказывает пригодность одной конструкции для всех</text>
<text x="284" y="223.8" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">возрастов.</text>
<text x="12" y="278" font-family="Arial" font-size="3.2808333333333333" font-weight="400" fill="#203540" text-anchor="start">Основания S1–S7: ACE, NASM, NHS, NHFT; полные ссылки и границы применения - в исследовательской записке. Подбор движений здесь служит анализу конструкции.</text>
</svg>