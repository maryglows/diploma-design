<text x="338.0" y="117.4" font-family="Arial" font-size="3.175" font-weight="400" fill="#667780" text-anchor="middle">Рука + корпус + нога: обмер</text>
<text x="280" y="180.0" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Детский пример [S7]. Поза схематичная, без размерного масштаба.</text>
<text x="280" y="184.3" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Вытягивание выходит за исходные точки опоры. Нужны переходы и смена</text>
<text x="280" y="188.6" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">стороны.</text>
<line x1="12" y1="205" x2="408" y2="205" fill="none" stroke="#E9EDEF" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="12" y="217" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Реальный радиус движения</text>
<text x="12" y="225.0" font-family="Arial" font-size="3.563055555555555" font-weight="400" fill="#203540" text-anchor="start">Фиксирую исходную точку x0, y0. По видео отмечаю крайние точки</text>
<text x="12" y="229.4" font-family="Arial" font-size="3.563055555555555" font-weight="400" fill="#203540" text-anchor="start">тела/предмета: r = max √[(xi - x0)² + (yi - y0)²]. Для шагов центр</text>
<text x="12" y="233.8" font-family="Arial" font-size="3.563055555555555" font-weight="400" fill="#203540" text-anchor="start">перемещается; нужен весь путь.</text>
<text x="146" y="217" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Полный цикл использования</text>
<text x="146" y="225.0" font-family="Arial" font-size="3.563055555555555" font-weight="400" fill="#203540" text-anchor="start">Достать → перенести → подготовить → выполнить → сменить</text>
<text x="146" y="229.4" font-family="Arial" font-size="3.563055555555555" font-weight="400" fill="#203540" text-anchor="start">пользователя → убрать. Проверить раскрытие хранения и место рядом с</text>
<text x="146" y="233.8" font-family="Arial" font-size="3.563055555555555" font-weight="400" fill="#203540" text-anchor="start">человеком; при необходимости - место помощника.</text>
<text x="280" y="217" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Проверенный пример [S9]</text>
<text x="280" y="225.0" font-family="Arial" font-size="3.563055555555555" font-weight="400" fill="#203540" text-anchor="start">Concept2: собранное место 155 × 66 см = 1,02 м²; с местом</text>
<text x="280" y="229.4" font-family="Arial" font-size="3.563055555555555" font-weight="400" fill="#203540" text-anchor="start">использования 203 × 97 см = 1,97 м² Р. Отдельные габариты полезны как</text>
<text x="280" y="233.8" font-family="Arial" font-size="3.563055555555555" font-weight="400" fill="#203540" text-anchor="start">метод; на наш проект числа не переносятся.</text>
<text x="12" y="286" font-family="Arial" font-size="3.2102777777777773" font-weight="400" fill="#667780" text-anchor="start">На следующем обмере: линейка в кадре, виды сверху/сбоку, все фазы и инвентарь. Высоты и углы не восстанавливать только по росту [S8].</text>
</svg>