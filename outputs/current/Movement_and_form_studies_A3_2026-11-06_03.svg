<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<rect width="420" height="297" fill="white"/>
<text x="12" y="19" font-family="Arial" font-size="8.113888888888887" font-weight="700" fill="#203540" text-anchor="start">Высота, радиусы и доступ к инвентарю</text>
<text x="12" y="29.0" font-family="Arial" font-size="3.8805555555555555" font-weight="400" fill="#203540" text-anchor="start">Проверяю объём движения по всем фазам. Рост стоя не определяет верхнюю точку гантели; площадь коврика не описывает подход, разворот и уборку.</text>
<text x="12" y="52" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Поднятые руки / вид спереди</text>
<text x="146" y="52" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Сесть → наклониться → встать</text>
<text x="280" y="52" font-family="Arial" font-size="4.2333333333333325" font-weight="700" fill="#087F80" text-anchor="start">Пол → крайнее вытягивание</text>
