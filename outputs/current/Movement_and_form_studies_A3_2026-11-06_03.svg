<text x="204.5" y="172.4" font-family="Arial" font-size="3.175" font-weight="400" fill="#667780" text-anchor="middle">Стул + наклон + стопы: измерить</text>
<text x="146" y="180.0" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">Высота сиденья 450 У - только макет. Нужны стопы на полу и подходящий</text>
<text x="146" y="184.3" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">захват; подлокотники могут менять доступ рук [S4, S5].</text>
<line x1="284" y1="166" x2="402" y2="166" fill="none" stroke="#667780" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/>
