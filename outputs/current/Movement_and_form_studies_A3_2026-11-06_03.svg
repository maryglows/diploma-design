<text x="103.8" y="119.0" font-family="Arial" font-size="3.175" font-weight="400" fill="#667780" text-anchor="middle" transform="rotate(-90,103.8,119.0)">2350 У: кисть + предмет</text>
<text x="18" y="59.0" font-family="Arial" font-size="3.175" font-weight="400" fill="#667780" text-anchor="start">2600 У: потолок / 1:25</text>
<text x="12" y="180.0" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">2250 У: кисть + 100 У: предмет. Просвет 250 Р. Рост 1760 - масштаб</text>
<text x="12" y="184.3" font-family="Arial" font-size="3.5277777777777777" font-weight="400" fill="#203540" text-anchor="start">прежнего листа; высота кисти задана отдельно.</text>
